{% extends "analysis/base.html" %}

{% block title %}Analyze URL{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm p-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-2">Analyze your website</h1>
    <p class="text-gray-600 mb-6">Enter your URL to get an AI visibility score and recommendations.</p>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.url }}
        {% if form.url.errors %}
        <p class="text-red-500 text-sm">{{ form.url.errors.0 }}</p>
        {% endif %}
        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
            Analyze
        </button>
    </form>
</div>
{% endblock %}
