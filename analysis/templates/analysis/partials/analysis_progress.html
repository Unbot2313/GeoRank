{# Progress shown while an analysis runs. Driven by static/js/analysis-loading.js. #}
<div data-analysis-progress class="hidden" role="status" aria-live="polite">
    <div class="h-1.5 w-full rounded-full bg-overlay-strong overflow-hidden">
        <div class="progress-indeterminate h-full w-2/5 rounded-full bg-brand"></div>
    </div>
    <p data-analysis-step class="mt-3 text-sm font-medium text-fg">Fetching the website…</p>
    <p class="mt-1 text-xs text-fg-muted">This can take up to a minute. Please keep this page open.</p>
</div>
