<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoRank - {% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <a href="{% url 'analysis:submit' %}" class="text-2xl font-bold text-blue-600 tracking-tight">GeoRank</a>
            <span class="text-sm text-gray-400 hidden sm:block">AI Visibility Analysis</span>
        </div>
    </nav>
    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8">
        {% block content %}{% endblock %}
    </main>
    <footer class="text-center text-sm text-gray-400 py-6">
        Built for Generative Engine Optimization
    </footer>
</body>
</html>
