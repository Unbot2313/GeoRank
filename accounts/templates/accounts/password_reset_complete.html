{% extends "analysis/base.html" %}

{% block title %}Password changed{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-surface rounded-2xl shadow-sm border border-line p-8 text-center">
        <div class="mb-5">
            <div class="mx-auto w-14 h-14 rounded-full bg-success-bg flex items-center justify-center">
                <span class="text-2xl">✓</span>
            </div>
        </div>

        <h1 class="text-3xl font-bold text-fg mb-3">
            Password changed
        </h1>

        <p class="text-fg-secondary mb-6">
            Your password has been updated successfully. You can now log in with your new password.
        </p>

        <a href="{% url 'accounts:login' %}"
           class="inline-flex justify-center w-full bg-brand text-white py-3.5 rounded-xl font-semibold hover:bg-brand-hover transition">
            Log in
        </a>
    </div>
</div>
{% endblock %}
